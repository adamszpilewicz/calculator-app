<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Order Pack Calculator</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container my-4">

<h1 class="mb-4">Order Pack Calculator</h1>

<div class="mb-4">
    <label for="quantity" class="form-label">Enter order quantity:</label>
    <input type="number" id="quantity" class="form-control mb-2" placeholder="e.g., 1000">
    <button id="calculate" class="btn btn-primary">Calculate</button>
</div>

<div class="mb-4">
    <h2>Available Pack Sizes:</h2>
    <ul id="packsizes" class="list-group"></ul>
</div>

<div class="mb-4">
    <h2>Manage Pack Sizes</h2>
    <label for="newSize" class="form-label">Add new pack size:</label>
    <input type="number" id="newSize" class="form-control mb-2" placeholder="e.g., 500">
    <button id="addSize" class="btn btn-success mb-3">Add Pack Size</button>

    <label for="deleteSize" class="form-label">Remove a pack size:</label>
    <input type="number" id="deleteSize" class="form-control mb-2" placeholder="e.g., 500">
    <button id="removeSize" class="btn btn-warning mb-3">Remove Pack Size</button>

    <br>
    <button id="removeAllSizes" class="btn btn-danger">⚠️ Remove All Pack Sizes</button>
</div>

<div class="mb-4">
    <h2>Result:</h2>
    <pre id="result" class="bg-light p-3 rounded">No calculation yet.</pre>
</div>

<script src="/static/app.js"></script>
</body>
</html>
