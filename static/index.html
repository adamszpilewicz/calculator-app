<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Order Pack Calculator</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        h1, h2 { color: #333; }
        label { display: block; margin-top: 10px; }
        input, button { padding: 8px; margin-top: 5px; }
        button { cursor: pointer; }
        #packsizes { list-style: none; padding: 0; }
        #packsizes li { background: #f0f0f0; margin: 2px 0; padding: 4px 8px; border-radius: 4px; }
        pre { background: #f8f8f8; padding: 10px; border-radius: 4px; }
    </style>
</head>
<body>
<h1>Order Pack Calculator</h1>

<label for="quantity">Enter order quantity:</label>
<input type="number" id="quantity" />
<button id="calculate">Calculate</button>

<h2>Available Pack Sizes:</h2>
<ul id="packsizes"></ul>



<h2>Manage Pack Sizes</h2>
<label for="newSize">Add new pack size:</label>
<input type="number" id="newSize" />
<button id="addSize">Add Pack Size</button>

<label for="deleteSize">Remove a pack size:</label>
<input type="number" id="deleteSize" />
<button id="removeSize">Remove Pack Size</button>

<br><br>
<button id="removeAllSizes" style="background: red; color: white;">⚠️ Remove All Pack Sizes</button>

<h2>Result:</h2>
<pre id="result">No calculation yet.</pre>

<script src="/static/app.js"></script>
</body>
</html>
